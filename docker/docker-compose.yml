services:
    app:
        image: ghcr.io/desaianand1/ariadnes-thread:latest
        restart: unless-stopped
        ports:
            - '3000:3000'
        volumes:
            - cache-data:/app/data
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
                reservations:
                    cpus: '0.25'
                    memory: 256M
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
            interval: 30s
            timeout: 3s
            start_period: 15s
            retries: 3
        environment:
            - ADAPTER=node
            - ORIGIN=${ORIGIN:?}
            - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:?}
            - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY:?}
            - RESEND_API_KEY=${RESEND_API_KEY:-}
            - LOG_LEVEL=${LOG_LEVEL:-warn}
            - ENABLE_EMAIL_SHARING=${ENABLE_EMAIL_SHARING:-false}

volumes:
    cache-data:
