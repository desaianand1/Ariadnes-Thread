# Traefik static config additions for Cloudflare proxy integration.
#
# HOW TO USE: Copy the relevant blocks below into Coolify → Server → Proxy
# → Configuration tab. Merge with the existing Traefik static config —
# do NOT replace the entire file.
#
# NOTE: vps-setup.sh step [15/15] generates a version of this file at
# /etc/traefik/cloudflare-trusted.yaml with LIVE Cloudflare IPs (refreshed
# bi-annually via systemd timer). Prefer that file over this one — the IPs here
# may be stale.

# --- Add under entryPoints.websecure (and optionally .web for port 80): ---
entryPoints:
    websecure:
        forwardedHeaders:
            trustedIPs:
                # Cloudflare IPv4 — https://www.cloudflare.com/ips-v4
                - '173.245.48.0/20'
                - '103.21.244.0/22'
                - '103.22.200.0/22'
                - '103.31.4.0/22'
                - '141.101.64.0/18'
                - '108.162.192.0/18'
                - '190.93.240.0/20'
                - '188.114.96.0/20'
                - '197.234.240.0/22'
                - '198.41.128.0/17'
                - '162.158.0.0/15'
                - '104.16.0.0/13'
                - '104.24.0.0/14'
                - '172.64.0.0/13'
                - '131.0.72.0/22'
                # Cloudflare IPv6 — https://www.cloudflare.com/ips-v6
                - '2400:cb00::/32'
                - '2606:4700::/32'
                - '2803:f800::/32'
                - '2405:b500::/32'
                - '2405:8100::/32'
                - '2a06:98c0::/29'
                - '2c0f:f248::/32'

# --- Add at the top level (merge, don't overwrite existing keys): ---
#
# Enables JSON access logs that fail2ban's http-scan jail watches.
# bufferingSize batches writes to reduce I/O on high-traffic servers.
accessLog:
    filePath: '/var/log/traefik/access.log'
    format: json
    bufferingSize: 100
