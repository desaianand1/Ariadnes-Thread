name = "ariadnes-thread"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-03-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
    { pattern = "modrinth.download", custom_domain = true }
]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Environment variables: all have Zod defaults in env.server.ts.
# Override per-environment in the Cloudflare dashboard or below.

# Secrets (set via Cloudflare dashboard or `wrangler secret put`):
# - RESEND_API_KEY: Email sending via Resend (optional)
# - TURNSTILE_SECRET_KEY: Cloudflare Turnstile server verification (required)
#
# Public env vars (safe to commit):
# - PUBLIC_TURNSTILE_SITE_KEY: Turnstile widget site key (required)

[observability]
enabled = true
# Free tier: 200k log events/day. Each request = 1 invocation log + N console.* calls.
# At 10% sampling even 100k req/day × ~5 events = 50k — well within budget.
head_sampling_rate = 0.1

[durable_objects]
bindings = [
    { name = "RESOLUTION_CACHE", class_name = "ResolutionCache" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ResolutionCache"]

[env.preview.observability]
enabled = true
head_sampling_rate = 1

[env.preview.vars]
MODRINTH_USER_AGENT = "AriadnesThread/preview"
PUBLIC_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
