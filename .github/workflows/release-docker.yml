name: Release Docker Image

on:
    release:
        types: [published]

concurrency:
    group: docker-release
    cancel-in-progress: true

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    docker:
        name: Build & Push Docker Image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.release.tag_name }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=raw,value=latest
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-prd:
        name: Deploy Production
        needs: [docker]
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Coolify deployment
              if: vars.COOLIFY_WEBHOOK_URL != ''
              run: |
                  CURL_ARGS=(-s -o /dev/null -w "%{http_code}")
                  if [ -n "${{ secrets.COOLIFY_TOKEN }}" ]; then
                    CURL_ARGS+=(--header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
                  fi
                  response=$(curl "${CURL_ARGS[@]}" "${{ vars.COOLIFY_WEBHOOK_URL }}")
                  if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
                    echo "::error::Coolify webhook returned HTTP $response"
                    exit 1
                  fi
                  echo "Deployment triggered (HTTP $response)"

    summary:
        name: Release Summary
        needs: [deploy-prd]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - run: |
                  echo "### Release ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Docker Build & Push | ${{ needs.deploy-prd.result != 'skipped' && 'passed' || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Production Deploy | ${{ needs.deploy-prd.result }} |" >> $GITHUB_STEP_SUMMARY
